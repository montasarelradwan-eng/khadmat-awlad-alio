<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات أولاد عليو</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #f3f6fa; color: #183047; }
        header { background: linear-gradient(135deg, #087f70, #075b70); color: white; text-align: center; padding: 35px 15px 25px; border-radius: 0 0 25px 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .brand-logo { display: inline-flex; align-items: center; justify-content: center; width: 85px; height: 85px; border: 3px solid rgba(255,255,255,0.85); border-radius: 50%; background: white; box-shadow: inset 0 0 10px rgba(255,255,255,0.2), 0 4px 8px rgba(0,0,0,0.15); margin-bottom: 15px; overflow: hidden; }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        header h1 { margin: 0 0 5px; font-size: 28px; font-weight: bold; }
        header p { margin: 0 0 15px; font-size: 15px; opacity: 0.9; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .search-box { width: 100%; padding: 12px 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 20px; outline: none; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 8px; color: #087f70; }
        .card p { margin: 4px 0; font-size: 14px; color: #555; }
        .badge { display: inline-block; background: #e0f2f1; color: #00796b; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
        .call-btn { display: inline-block; margin-top: 8px; padding: 6px 12px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <h1>خدمات أولاد عليو</h1>
        <p>دليلك الشامل لخدمات وأطباء ومهنيي البلينا</p>
    </header>

    <div class="container">
        <input type="text" id="search" class="search-box" placeholder="ابحث عن دكتور، صيدلية، مهني، أو خدمة..." onkeyup="filterServices()">
        
        <div id="services-list"></div>
    </div>

    <script>
        // جميع الأقسام والخدمات (أطباء، صيدليات، مهنيين، مستشفيات...)
        const services = [
            // --- قسم الأطباء والمستشفيات ---
            {
                name: "د. مينا بولس",
                category: "أطباء ومستشفيات",
                details: "تخصص: أطفال وحديثي الولادة | العنوان: شارع الجمهورية - البلينا",
                phone: "01068531980"
            },
            {
                name: "عيادة البلينا العامة (د. يوسف عبد العظيم)",
                category: "أطباء ومستشفيات",
                details: "تخصص: نساء والتوليد | العنوان: شارع الجمهورية - أمام المستشفى العام",
                phone: "01111812366"
            },
            {
                name: "عيادة البلينا التخصصية",
                category: "أطباء ومستشفيات",
                details: "تخصص: باطنة وقلب | العنوان: شارع الجمهورية - بجوار المركز الحضري",
                phone: "01220904632"
            },
            {
                name: "مستشفى البلينا المركزي",
                category: "أطباء ومستشفيات",
                details: "تخصص: طوارئ واستقبال (24 ساعة)",
                phone: "0934800301"
            },

            // --- قسم الصيدليات ---
            {
                name: "صيدلية الإسعاف",
                category: "صيدليات",
                details: "خدمة ومستلزمات طبية (خدمة 24 ساعة)",
                phone: "01000000001"
            },

            // --- قسم المهنيين والخدمات الحرفية ---
            {
                name: "ورشة وصيانة الكهرباء",
                category: "مهنيين وحرفيين",
                details: "تصليح أجهزة منزلية وتمديدات كهربائية",
                phone: "01000000002"
            }
            
            // يمكنك إضافة أي عدد من الأقسام والخدمات الجديدة هنا بنفس الطريقة
        ];

        function displayServices(list) {
            const container = document.getElementById("services-list");
            container.innerHTML = "";
            if(list.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666;">عذراً، لم نجد نتائج مطابقة للبحث.</p>`;
                return;
            }
            list.forEach(s => {
                container.innerHTML += `
                    <div class="card">
                        <span class="badge">${s.category}</span>
                        <h3>${s.name}</h3>
                        <p><strong>التفاصيل:</strong> ${s.details}</p>
                        <a href="tel:${s.phone}" class="call-btn">📞 إتصال: ${s.phone}</a>
                    </div>
                `;
            });
        }

        function filterServices() {
            const query = document.getElementById("search").value.toLowerCase();
            const filtered = services.filter(s => 
                s.name.toLowerCase().includes(query) || 
                s.category.toLowerCase().includes(query) || 
                s.details.toLowerCase().includes(query)
            );
            displayServices(filtered);
        }

        displayServices(services);
    </script>
</body>
</html>
